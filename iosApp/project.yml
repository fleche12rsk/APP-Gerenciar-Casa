# Projeto Xcode gerado pelo XcodeGen (brew install xcodegen; xcodegen generate).
# O framework Kotlin "Shared" vem de ../shared (./gradlew :shared:linkReleaseFrameworkIosArm64).
name: Casa
options:
  bundleIdPrefix: dev.micio
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Casa:
    type: application
    platform: iOS
    sources:
      - path: Casa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.micio.casa
        PRODUCT_NAME: Casa
        INFOPLIST_FILE: Casa/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
schemes:
  Casa:
    build:
      targets:
        Casa: all
    archive:
      config: Release
