name: IPA (iOS)

# Roda num Mac do GitHub. Num repositório privado, minutos de macOS contam 10x na cota
# gratuita; por isso só roda quando algo do iOS/código compartilhado muda, ou à mão.
on:
  workflow_dispatch:
  push:
    paths:
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/ios.yml"

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O Gradle configura também o módulo Android, que precisa do SDK.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache do Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Framework Kotlin (código compartilhado)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Projeto Xcode e dependências
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate
          pod install

      - name: Compilar o app
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Casa.xcworkspace \
            -scheme Casa \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Casa.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Empacotar IPA (sem assinatura, para Sideloadly/AltStore)
        working-directory: iosApp
        run: |
          mkdir -p Payload
          cp -R build/Casa.xcarchive/Products/Applications/Casa.app Payload/
          zip -qry Casa.ipa Payload
          ls -lh Casa.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: casa-ipa
          path: iosApp/Casa.ipa
